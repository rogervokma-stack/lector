# Fork only, never part of the PR: the api-tests and lint jobs, plus prettier on the
# touched files, without the image jobs (they push to ghcr on workflow_dispatch).
name: CI

on:
  push:
    branches: [ruby-base-text-verify2]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install eSpeak NG
        run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: bun install --frozen-lockfile
        working-directory: api
      - name: Typecheck API
        run: bun run typecheck
        continue-on-error: true
        working-directory: api
      - name: Ruby tests alone
        run: rm -rf .test-data && DATA_DIR=.test-data bun test src/lib/epub-parser.test.ts src/routes/extract-url.test.ts
        continue-on-error: true
        working-directory: api
      - run: bun run test
        working-directory: api

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check api/src/lib/html-to-markdown.ts api/src/lib/epub-parser.test.ts api/src/routes/extract-url.ts api/src/routes/extract-url.test.ts
